<body data-page="resources">
  <div class="page-shell inner-shell">
    <header class="inner-hero">
      <nav class="topbar">
        <a class="brand" href="../../index.html">
          <span class="brand-mark">B</span>
          <div>
            <p class="eyebrow">BaoBao Web</p>
            <h1>Notes</h1>
          </div>
        </a>
        <div class="nav-links">
          <a href="../../index.html">首页</a>
          <a href="../topics/index.html">学习专题</a>
          <a href="../reference/index.html">资料查询</a>
          <a href="../archive/index.html">Archive</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="section">
        <div class="section-heading split-heading">
          <div>
            <p class="eyebrow">Notes</p>
            <h3>学习文档与博客化笔记</h3>
          </div>
          <div class="resource-tabs" id="resource-tabs"></div>
        </div>
        <div class="resource-toolbar">
          <label class="search-box" for="resource-search">
            <span>搜索文档</span>
            <input id="resource-search" type="search" placeholder="输入关键词，比如 CPU / NPU / Agent">
          </label>
          <p class="resource-summary" id="resource-summary"></p>
        </div>
        <div class="resource-grid" id="resource-list"></div>
      </section>

      <section class="section">
        <div class="section-heading split-heading">
          <div>
            <p class="eyebrow">Writing Style</p>
            <h3>推荐你后续按这三层来写</h3>
          </div>
          <p class="heading-note">这样既能积累深度内容，也不会让每篇笔记都写得很重。</p>
        </div>
        <div class="overview-grid">
          <article class="overview-card">
            <span class="card-tag">Map</span>
            <h4>方向总览</h4>
            <p>一页讲清一个方向里最值得长期跟踪的问题、关键词和阅读顺序。</p>
          </article>
          <article class="overview-card">
            <span class="card-tag">Note</span>
            <h4>主题笔记</h4>
            <p>针对一个具体问题展开，比如乱序执行、数据流、Agent 工作流拆解。</p>
          </article>
          <article class="overview-card">
            <span class="card-tag">Snippet</span>
            <h4>短备忘</h4>
            <p>记录命令、判断标准、易错点和自己的经验，不必每次都写成长文。</p>
          </article>
          <article class="overview-card">
            <span class="card-tag">Link</span>
            <h4>延伸入口</h4>
            <p>把真正值得反复打开的论文、代码库和教程集中收进查询页。</p>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script src="../../assets/js/site-data.js?v=20260404d"></script>
